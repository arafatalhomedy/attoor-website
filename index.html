    <title>attoor-project</title>
    <script type="text/javascript">
      // Single-Page Apps for GitHub Pages
      // This runs on the real index.html after the 404.html redirect fires,
      // and restores the original URL so React Router sees the correct path.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
