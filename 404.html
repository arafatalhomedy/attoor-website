<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Attoor.CEGS</title>
    <script type="text/javascript">
      // Single-Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages doesn't support SPA routing natively. When someone hits
      // a route directly (typed URL, refresh, bookmark) that isn't a real file,
      // GitHub serves this 404.html instead. This script rewrites the URL into
      // a query string and redirects to the real index.html, which then
      // restores the original path so React Router can take over correctly.
      var pathSegmentsToKeep = 1; // keep "/attoor-website" as the base

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
